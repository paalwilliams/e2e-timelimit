name: LeechProxy
version: "0.1.0"
slug: leechproxy
description: Network-wide, per-person site blocking and daily time limits (transparent SNI proxy; HA must be the network gateway)
url: https://github.com/paalwilliams/e2e-timelimit/tree/leechproxy/proxy
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
host_network: true
privileged:
  - NET_ADMIN
  - NET_RAW
ingress: true
ingress_port: 8765
panel_icon: mdi:timer-lock-outline
panel_title: LeechProxy
options:
  interface: end0
  block_quic: true
  explicit_proxy: true
  https_block_page: true
  active_bytes: 2048
  recheck_seconds: 15
schema:
  interface: str
  block_quic: bool
  explicit_proxy: bool
  https_block_page: bool
  active_bytes: int(1,)
  recheck_seconds: int(1,600)
  ui_password: password?
